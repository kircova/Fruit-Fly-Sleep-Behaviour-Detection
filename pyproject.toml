[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flyact"
version = "0.1.0"
description = "Leak-free video classification of Drosophila micro-behaviours (feeding, grooming, proboscis pumping)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "av>=12",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
flyact = "flyact.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flyact"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
