# The final model at the full resolution of the crop cache (224 px instead of 160 px).
# Motivated by the error analysis: mistakes concentrate in clips where the fly barely
# moves and the classes differ only in what the proboscis and legs are doing.
name: triplet_2d_224
sampling: {image_size: 224}
model: {temporal: none}
train: {save_checkpoints: true}
