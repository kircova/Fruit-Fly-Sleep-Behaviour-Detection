# Main model: ResNet-18 + temporal shift on fly-centred frame triplets.
name: tsm_triplet
split: group
sampling:
  num_snippets: 8      # snippets per window
  stride: 8            # frames between snippets  -> one window spans 61 frames (2 s at 30 FPS)
  delta: 2             # frames between the three channels of a snippet (67 ms)
  input_mode: triplet
  image_size: 160
  eval_windows: 10
model:
  backbone: resnet18
  temporal: tsm
  pretrained: true
  dropout: 0.3
train:
  epochs: 15
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.01
  label_smoothing: 0.1
  warmup_epochs: 1
  augment: true
  seed: 0
